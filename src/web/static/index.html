<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PIP-UI</title>
<style>
/* ===========================================================================
   1. TOKENS
   Every theme is only a variable block -- no structural CSS below changes.
   That is why eight themes cost about what two would.
   =========================================================================== */
:root{
  --font-ui: system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans","Noto Sans",sans-serif;
  --font-mono: ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono","Noto Mono",monospace;
  --z-splash: 60; --z-modal: 50; --z-toast: 40; --z-sheet: 30; --z-header: 10;
}
[data-theme]{
  --metal-hi:#3b414b; --metal:#2b2f37; --metal-lo:#0f1114;
  --face-hi:#242830; --face-lo:#191c22; --recess:#0c0e12;
  --ink:#e8e6e1; --ink-dim:#8a9098; --ink-faint:#8a8f95;
  --accent:#f2b544; --on-accent:#1a1205;
  --green:#4ab46e; --red:#e4666c; --cyan:#54b9c4;
  --bg1:#15171b; --bg2:#101216;
  --pin:rgba(255,255,255,.014); --hi:rgba(255,255,255,.04); --hi2:rgba(255,255,255,.05);
}
[data-theme="night"]{
  --metal-hi:#3d0f0b; --metal:#2a0a08; --metal-lo:#0a0000;
  --face-hi:#150303; --face-lo:#0d0202; --recess:#080000;
  --ink:#f5483a; --ink-dim:#b95c55; --ink-faint:#9e6c68;
  --accent:#f5483a; --on-accent:#180100;
  --green:#f5483a; --red:#f5483a; --cyan:#f5483a;
  --bg1:#0a0000; --bg2:#000000;
  --hi:rgba(245,72,58,.05); --hi2:rgba(245,72,58,.06);
}
[data-theme="bench"]{
  --metal-hi:#2c3e4f; --metal:#1e2b38; --metal-lo:#080d12;
  --face-hi:#18222d; --face-lo:#141c26; --recess:#0b1016;
  --ink:#e6f0f6; --ink-dim:#8aa4b5; --ink-faint:#778a99;
  --accent:#36d1cc; --on-accent:#04161a;
  --green:#36d1cc; --red:#ff6b6b; --cyan:#36d1cc;
  --bg1:#0a1017; --bg2:#000000;
}
[data-theme="field"]{
  --metal-hi:#3a3a3a; --metal:#2e2e2e; --metal-lo:#000000;
  --face-hi:#161616; --face-lo:#101010; --recess:#000000;
  --ink:#ffffff; --ink-dim:#b5b5b5; --ink-faint:#8a8a8a;
  --accent:#f7931e; --on-accent:#000000;
  --green:#24d16a; --red:#ff3b30; --cyan:#f7931e;
  --bg1:#0a0a0a; --bg2:#000000;
}
[data-theme="phosphor"]{
  --metal-hi:#1c3a24; --metal:#123018; --metal-lo:#02120a;
  --face-hi:#0a1f10; --face-lo:#06170b; --recess:#020d06;
  --ink:#7dfca8; --ink-dim:#3f9b62; --ink-faint:#5d8e70;
  --accent:#39ff88; --on-accent:#02170a;
  --green:#39ff88; --red:#ff7b6b; --cyan:#39ff88;
  --bg1:#04140a; --bg2:#010703;
  --hi:rgba(125,252,168,.05); --hi2:rgba(125,252,168,.06);
}
[data-theme="amber"]{
  --metal-hi:#3d2e10; --metal:#2b200a; --metal-lo:#120b02;
  --face-hi:#1e1608; --face-lo:#150f05; --recess:#0b0702;
  --ink:#ffc24d; --ink-dim:#a87c22; --ink-faint:#947e51;
  --accent:#ffb01f; --on-accent:#1a1002;
  --green:#ffc24d; --red:#ff6b3d; --cyan:#ffc24d;
  --bg1:#120c02; --bg2:#080500;
  --hi:rgba(255,194,77,.05); --hi2:rgba(255,194,77,.06);
}
[data-theme="blueprint"]{
  --metal-hi:#1f3d63; --metal:#162c49; --metal-lo:#050d1a;
  --face-hi:#0e2038; --face-lo:#0a182b; --recess:#040c18;
  --ink:#d6e8ff; --ink-dim:#7f9fc4; --ink-faint:#6e8aa9;
  --accent:#4db8ff; --on-accent:#03121f;
  --green:#3ed6a0; --red:#ff6b8a; --cyan:#4db8ff;
  --bg1:#061223; --bg2:#030a14;
}
[data-theme="daylight"]{
  --metal-hi:#ffffff; --metal:#c3c9d2; --metal-lo:#9aa2ad;
  --face-hi:#ffffff; --face-lo:#eaeef3; --recess:#dfe4ec;
  --ink:#10151b; --ink-dim:#4a535f; --ink-faint:#5d6671;
  --accent:#0062c4; --on-accent:#ffffff;
  --green:#12813f; --red:#c2231f; --cyan:#0062c4;
  --bg1:#f3f6fa; --bg2:#e4e9f0;
  --pin:rgba(0,0,0,.02); --hi:rgba(255,255,255,.9); --hi2:rgba(255,255,255,.95);
}

/* ===========================================================================
   2. BASE
   =========================================================================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-ui);font-size:13px;color:var(--ink);
  -webkit-user-select:none;user-select:none;overflow:hidden;
  /* Kiosk hardening: no pull-to-refresh or rubber-band at the scroll edges,
     and no 300ms double-tap-zoom delay on taps. */
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  background:repeating-linear-gradient(90deg,var(--pin) 0 1px,transparent 1px 3px),
             linear-gradient(180deg,var(--bg1),var(--bg2));
}
/* Chromium --kiosk still shows a pointer; ?kiosk=1 hides it without needing
   unclutter installed. */
body.kiosk,body.kiosk *{cursor:none}
#app{height:100%;display:flex;flex-direction:column}
.mono{font-family:var(--font-mono)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--metal);border-radius:3px}

/* ===========================================================================
   3. HEADER
   =========================================================================== */
header{
  height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;
  z-index:var(--z-header);border-bottom:1px solid var(--metal-lo);
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  box-shadow:inset 0 1px 0 var(--hi2),0 2px 6px rgba(0,0,0,.45);
}
.iconbtn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;cursor:pointer;
  color:var(--ink);border-radius:6px;font:inherit;
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi);
}
.iconbtn:active{transform:translateY(1px);filter:brightness(.92)}
.iconbtn svg.ic{width:19px;height:19px}
.iconbtn[hidden]{display:none}
.plate{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:.15em;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pwr{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green)}
.presence{display:flex;gap:10px;margin-left:auto;align-items:center}
.pchip{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.pchip[data-on="1"]{color:var(--ink-dim)}
.lcd{flex:1;max-width:190px;min-width:96px;position:relative;height:34px;border-radius:5px;
  overflow:hidden;background:var(--recess);border:1px solid var(--metal-lo);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.spec{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;padding:3px 5px}
.spec i{flex:1;height:100%;background:var(--accent);opacity:.4;border-radius:1px 1px 0 0;
  transform-origin:bottom;transition:transform .16s linear}
.lcd-read{position:absolute;top:4px;left:8px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.08em;color:var(--accent)}

/* ---------------------------------------------------------------------------
   LED -- colour AND shape.
   In the night theme every hue collapses to red, so hue alone cannot carry
   state. The silhouette does: filled circle = pass, hollow = idle,
   haloed = running, rounded square = fault.
   --------------------------------------------------------------------------- */
.led{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-faint);
  position:relative}
.led[data-s="PASS"]{background:var(--green)}
.led[data-s="idle"],.led[data-s="UNKNOWN"]{background:transparent;
  box-shadow:inset 0 0 0 2px var(--ink-faint)}
.led[data-s="WARN"]{background:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent);
  animation:pulse 1.6s ease-in-out infinite}
.led[data-s="FAIL"]{background:var(--red);border-radius:2px}
.led.lg{width:11px;height:11px}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 32%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 7%,transparent)}
}

/* ===========================================================================
   4. LAYOUT + PANELS
   =========================================================================== */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:11px 12px 16px;
  -webkit-overflow-scrolling:touch}
.view{display:none}
.view.on{display:block}
.sec{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.sec:not(:first-child){margin-top:14px}
.sec svg.ic{width:13px;height:13px;color:var(--ink-faint);stroke-width:1.5}
.sec .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.sec .groove{flex:1;height:0;border-top:1px solid var(--metal-lo);box-shadow:0 1px 0 var(--metal)}

.panel{
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi);
  border-bottom-color:var(--metal-lo);border-radius:8px;padding:12px;
  box-shadow:inset 0 1px 0 var(--hi),0 1px 3px rgba(0,0,0,.4);margin-bottom:10px}
.panel > h3{margin:0 0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:600}
.readout{background:var(--recess);border:1px solid var(--metal-lo);border-radius:6px;
  padding:10px 12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.readout .rl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.readout .big{font-family:var(--font-mono);font-size:20px;letter-spacing:.09em;
  color:var(--cyan);margin-top:3px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:10.5px;color:var(--cyan);border:1px solid var(--metal);
  background:var(--recess);border-radius:4px;padding:2px 6px}

.row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;
  border-bottom:1px solid var(--metal-lo)}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-dim)}
.row .v{margin-left:auto;font-family:var(--font-mono);color:var(--ink);text-align:right;
  word-break:break-all}
.row .v.dim{color:var(--ink-faint)}

/* Status row: LED + a label that must never wrap + a detail that often runs
   long (a probe explaining itself). Clamped to two lines so one chatty probe
   cannot push everything else off a 480px screen. */
.srow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12.5px;
  border-bottom:1px solid var(--metal-lo)}
.srow:last-child{border-bottom:0}
.srow .led{margin-top:3px}
.srow .k{color:var(--ink-dim);white-space:nowrap;flex:none}
.srow .d{flex:1;min-width:0;text-align:right;font-family:var(--font-mono);font-size:11.5px;
  color:var(--ink-dim);line-height:1.45;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}

/* ---- mmwave radar scope: same recessed well as .readout, sized for the
   LD2450's 30-degree each-side fan rather than a full circle. ---- */
.scope{background:var(--recess);border:1px solid var(--metal-lo);border-radius:6px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);width:100%;aspect-ratio:4/3;display:block}
.scope .grid-line{fill:none;stroke:var(--metal);stroke-width:1}
.scope .edge-line{fill:none;stroke:var(--metal);stroke-width:1;stroke-dasharray:3 3}
.scope .range-lbl{font-family:var(--font-mono);font-size:12px;fill:var(--ink-dim)}
.scope .blip{fill:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
.scope .blip-ring{fill:none;stroke:var(--accent);stroke-width:1;opacity:.45}
.scope .blip-lbl{font-family:var(--font-mono);font-size:8.5px;fill:var(--ink)}

/* ---- tiles ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}

/* ---- simple home: a handful of plain, oversized tiles instead of the full
   20-tool grid -- see RENDER.home / state.mode. Reuses .mod's structure. ---- */
.simple-head{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:4px 0 14px}
.simple-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
.simple-head .exit{display:inline-flex;align-items:center;min-height:44px;
  font-size:12px;color:var(--ink-faint);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;background:none;border:0;
  font:inherit;padding:0 10px;margin:0 -10px}
.simple-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.simple-grid .mod{min-height:132px;align-items:center;text-align:center;
  justify-content:center;gap:9px;padding:18px 14px}
.simple-grid .mod .top{justify-content:center}
.simple-grid .mod svg.ic{width:34px;height:34px}
.simple-grid .mod .nm{font-size:15px}
.simple-grid .mod .cmd{font-family:var(--font-ui);font-size:12px;white-space:normal;
  text-overflow:clip;overflow:visible}
.mod{position:relative;display:flex;flex-direction:column;gap:4px;padding:9px 10px;
  min-height:70px;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi);
  border-bottom-color:var(--metal-lo);
  box-shadow:inset 0 1px 0 var(--hi),0 1px 2px rgba(0,0,0,.35);
  transition:transform .06s,filter .12s}
.mod:active{transform:translateY(1px);filter:brightness(.93)}
.mod .top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.mod svg.ic{width:20px;height:20px;color:var(--ink-dim)}
.mod .nm{font-size:13px;font-weight:600}
.mod .cmd{margin-top:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .up{margin-top:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--accent)}
.mod.on{border-color:var(--accent);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--accent)}
.mod.on svg.ic{color:var(--accent)}
.mod.off{opacity:.45;cursor:not-allowed}
.mod .topr{display:flex;align-items:center;gap:4px}
.mod .info,.mod .openlink{display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
  padding:9px;margin:-9px;border-radius:50%}
.mod .info svg.ic,.mod .openlink svg.ic{width:15px;height:15px}
.mod .info:hover,.mod .info:active,.mod .openlink:hover,.mod .openlink:active{color:var(--ink);background:rgba(127,127,127,.15)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--metal);border-radius:3px;padding:1px 4px;white-space:nowrap}
.tag.warn{color:var(--red);border-color:var(--red)}

/* ---- scanner: inline signal-history bars, same technique as the header's
   CPU history (#spec), just small enough to sit in a list row. ---- */
.mini-spark{display:inline-flex;align-items:flex-end;gap:1px;height:14px;width:36px;
  vertical-align:middle;flex:none}
.mini-spark i{flex:1;background:var(--ink-faint);border-radius:1px 1px 0 0;min-height:1px}

/* ---- buttons ---- */
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 14px;border-radius:6px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--ink);
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi)}
/* `.btn{display:inline-flex}` otherwise beats the `hidden` attribute's own
   `display:none` -- same specificity tier, author rule wins. showInfo()
   relies on hiding #mNo, so this isn't optional. */
.btn[hidden]{display:none}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn svg.ic{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{color:var(--on-accent);background:var(--accent);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
/* Night: a large saturated fill is the worst thing to show a dark-adapted eye. */
[data-theme="night"] .btn.pri{background:transparent;color:var(--accent);
  border:1px solid var(--accent)}

/* ---- sub-nav inside a view (mirrors the Tkinter IR tabs) ---- */
.tabs{display:flex;gap:4px;margin-bottom:10px;padding:3px;border-radius:7px;
  background:var(--recess);border:1px solid var(--metal-lo)}
.tabs button{flex:1;min-height:44px;border:0;border-radius:5px;cursor:pointer;font:inherit;
  font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--ink-dim);background:transparent}
.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--accent)}
[data-theme="night"] .tabs button[aria-selected="true"]{color:var(--accent);
  background:transparent;box-shadow:inset 0 0 0 1px var(--accent)}

input[type="text"],input[type="search"],select{font:inherit;font-size:12px;color:var(--ink);
  background:var(--recess);border:1px solid var(--metal);border-radius:6px;
  padding:8px 10px;min-height:44px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-2px}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:44px}

.progress{height:8px;border-radius:4px;background:var(--recess);overflow:hidden;
  border:1px solid var(--metal-lo);margin:9px 0}
.progress i{display:block;height:100%;width:100%;background:var(--accent);
  transform-origin:left;transition:transform .18s linear}

.list{max-height:228px;overflow-y:auto;margin-top:2px}
.listitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;
  font-size:12px;color:var(--ink);cursor:pointer;padding:7px 8px;border:0;
  border-bottom:1px solid var(--metal-lo);background:transparent}
.listitem .sub2{margin-left:auto;font-size:11px;color:var(--ink-dim);
  font-family:var(--font-mono);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.pill{min-height:44px;padding:0 10px;border-radius:6px;cursor:pointer;font:inherit;
  font-size:12px;font-weight:600;color:var(--ink);
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pill[disabled]{opacity:.4;cursor:not-allowed}

/* ---- toggle switch (feature flags) ----
   The whole row is the hit target (min-height:44px, cursor:pointer), not just
   the visual switch -- a 26px-tall switch was the only tappable thing in a
   screen made entirely of toggles. */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 2px;min-height:44px;border-bottom:1px solid var(--metal-lo);cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle .label{font-size:13px;color:var(--ink)}
.swbtn{width:46px;height:26px;flex:none;border-radius:13px;cursor:pointer;position:relative;
  background:var(--recess);border:1px solid var(--metal);padding:0;pointer-events:none}
.swbtn::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:var(--ink-dim);transition:transform .14s ease,background .14s ease}
.swbtn[aria-pressed="true"]{border-color:var(--accent)}
.swbtn[aria-pressed="true"]::after{transform:translateX(20px);background:var(--accent)}

.banner{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--accent);
  background:var(--recess);border:1px solid var(--metal);border-radius:7px;
  padding:10px 12px;margin-bottom:10px;line-height:1.4}
.banner svg.ic{width:16px;height:16px;margin-top:1px}
.banner.bad{color:var(--red)}
.empty{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:26px 12px;line-height:1.5}

/* ---- pin header map ---- */
.hdr40{display:grid;grid-template-columns:1fr auto 1fr;gap:0 10px;align-items:center;
  font-family:var(--font-mono);font-size:10px}
.pin{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:3px;
  min-height:19px;white-space:nowrap;overflow:hidden}
.pin.r{flex-direction:row-reverse;text-align:right}
.pin .no{width:17px;text-align:center;color:var(--ink-faint);border:1px solid var(--metal);
  border-radius:3px;flex:none;font-size:9px}
.pin .nmx{color:var(--ink-dim);flex:none}
.pin .fn{color:var(--ink-faint);font-size:9px;overflow:hidden;text-overflow:ellipsis}
.pin.assigned{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.pin.assigned .nmx,.pin.assigned .fn{color:var(--accent)}
.pin.assigned .no{border-color:var(--accent);color:var(--accent)}
/* "rail", not "pwr" -- the header's power LED already owns .pwr, and the
   collision turned every 3V3/5V row into a 7px green dot. */
.pin.rail .nmx{color:var(--red)}
.pin.gnd .nmx{color:var(--ink-faint)}
.spine{width:12px;border-left:1px dashed var(--metal);height:100%}

/* ---- theme picker ---- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:6px;cursor:pointer;
  font:inherit;color:var(--ink);text-align:left;
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:11px;height:11px;border-radius:50%;display:block}
.swatch .tn{font-size:11px;font-weight:600}
.swatch .td{font-size:10.5px;color:var(--ink-dim)}

/* ===========================================================================
   5. OVERLAYS -- splash, modal, toast
   =========================================================================== */
#splash{position:fixed;inset:0;z-index:var(--z-splash);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:24px;
  background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#splash.gone{opacity:0;pointer-events:none;transition:opacity .32s ease}
@media (prefers-reduced-motion:reduce){#splash.gone{transition:none}}
#splash .mark{font-size:15px;font-weight:700;letter-spacing:.3em;color:var(--accent)}
#splash .sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#bootlist{width:100%;max-width:340px;margin-top:4px}
#bootlist .row{padding:5px 0;font-size:12.5px}
#bootlist .row .v{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  font-family:var(--font-ui);font-weight:700;color:var(--ink-dim)}

#modal{position:fixed;inset:0;z-index:var(--z-modal);display:none;align-items:center;
  justify-content:center;padding:22px;background:rgba(0,0,0,.62)}
#modal.on{display:flex}
#modal .box{width:100%;max-width:380px;border-radius:9px;padding:16px;
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi);
  box-shadow:0 8px 28px rgba(0,0,0,.6)}
#modal h4{margin:0 0 7px;font-size:14px}
#modal p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5}
#modal .warn{margin-top:9px;font-size:11.5px;color:var(--red);font-family:var(--font-mono);
  word-break:break-all}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);
  z-index:var(--z-toast);opacity:0;pointer-events:none;padding:10px 16px;border-radius:7px;
  font-size:12.5px;max-width:86vw;text-align:center;
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  border:1px solid var(--metal);border-top-color:var(--metal-hi);
  box-shadow:0 4px 16px rgba(0,0,0,.55);transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
"use strict";
/* ===========================================================================
   7. SMALL HELPERS
   =========================================================================== */
const $  = s => document.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d; };
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* localStorage can throw in a private window or with site data blocked. */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("on"), 2200);
}

function fmtUptime(s){
  if (!s) return "just started";
  if (s < 60) return `up ${Math.round(s)}s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `up ${m}m` : `up ${Math.floor(m/60)}h ${m%60}m`;
}
/* The tile's one-line summary. `short` is written to be tight on its own --
   not derived from `desc`, which is the longer text behind the info tap.
   Falls back to the first sentence of `desc`, then the old per-kind text, for
   any tool added without writing a `short`. */
function glanceText(t){
  if (t.short) return t.short;
  if (t.desc) return t.desc.split(/\.\s/)[0].replace(/\.$/, "") + ".";
  if (t.kind === "builtin") return "on-device";
  if (t.kind === "link") return t.note || t.url;
  if (t.kind === "service") return t.note || t.unit || t.url;
  return t.note || t.cmd;
}
function ago(iso){
  if (!iso) return "—";
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  return `${Math.floor(d/86400)}d ago`;
}

/* Confirm gate for anything destructive or privileged. */
function confirmAction({ title, body, detail, confirmLabel = "Confirm" }){
  return new Promise(resolve => {
    $("#mTitle").textContent = title;
    $("#mBody").textContent = body;
    const warn = $("#mWarn");
    warn.hidden = !detail;
    warn.textContent = detail || "";
    $("#mYes").textContent = confirmLabel;
    $("#modal").classList.add("on");
    const done = (ok) => {
      $("#modal").classList.remove("on");
      $("#mYes").onclick = $("#mNo").onclick = null;
      resolve(ok);
    };
    $("#mYes").onclick = () => done(true);
    $("#mNo").onclick  = () => done(false);
  });
}

/* Read-only "what is this" popover for a tile's info icon -- reuses the same
   modal box as confirmAction, temporarily dressed as a single-button dialog. */
function showInfo(title, body){
  $("#mTitle").textContent = title;
  $("#mBody").textContent = body;
  $("#mWarn").hidden = true;
  $("#mNo").hidden = true;
  $("#mYes").textContent = "Close";
  $("#mYes").classList.remove("danger");
  $("#modal").classList.add("on");
  const close = () => {
    $("#modal").classList.remove("on");
    $("#mYes").onclick = null;
    $("#mNo").hidden = false;
    $("#mYes").classList.add("danger");
  };
  $("#mYes").onclick = close;
}

/* Plain-language legend for the LED states and tile badges -- there was
   previously no explanation anywhere in the UI for what a dot's color/shape
   or a tag's text meant. Built from spans + <br>, not <div>s, since #mBody
   is a <p> and must stay phrasing content. */
function showLegend(){
  $("#mTitle").textContent = "What the lights and tags mean";
  $("#mBody").innerHTML = [
    ["PASS", "Ready to use"],
    ["WARN", "Running right now"],
    ["FAIL", "Not working"],
    ["idle", "Installed, not running"],
  ].map(([s, label]) => `<span style="display:inline-flex;align-items:center;gap:8px;margin:3px 0">
    <span class="led" data-s="${s}"></span>${esc(label)}</span>`).join("<br>")
    + "<br><br>" + [
    ["tag warn", "absent", "Not installed on this device"],
    ["tag warn", "unreachable", "Lives on another device that's offline"],
    ["tag", "root", "Works, but needs your approval to start"],
  ].map(([cls, text, label]) => `<span style="display:inline-flex;align-items:center;gap:8px;margin:3px 0">
    <span class="${cls}">${text}</span>${esc(label)}</span>`).join("<br>");
  $("#mWarn").hidden = true;
  $("#mNo").hidden = true;
  $("#mYes").textContent = "Close";
  $("#mYes").classList.remove("danger");
  $("#modal").classList.add("on");
  const close = () => {
    $("#modal").classList.remove("on");
    $("#mYes").onclick = null;
    $("#mNo").hidden = false;
    $("#mYes").classList.add("danger");
  };
  $("#mYes").onclick = close;
}

/* ===========================================================================
   8. API
   =========================================================================== */
const state = { health:null, tools:[], toolsErr:"", settings:null, view:"home", booted:false };

async function api(path, opts){
  const res = await fetch(path, { headers:{ "Content-Type":"application/json" }, ...opts });
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    // Several endpoints (pm3 search/read) return a non-2xx for a normal
    // negative result ("no tag found"), not just real failures -- the body
    // still carries useful detail (raw output, parsed id, ...), so it rides
    // along on the thrown Error instead of being dropped on the floor.
    const err = new Error(body?.detail || body?.message || `HTTP ${res.status}`);
    err.body = body;
    throw err;
  }
  return body;
}

/* ===========================================================================
   9. THEMES
   =========================================================================== */
const THEMES = [
  ["instrument","Instrument Face","graphite · amber"],
  ["night",     "Night Vision",   "mono red · dark-adapted"],
  ["bench",     "Bench Continuity","teal · matches Tkinter"],
  ["field",     "High-Contrast",  "white · mascot orange"],
  ["phosphor",  "Phosphor",       "CRT green"],
  ["amber",     "Amber CRT",      "mono amber"],
  ["blueprint", "Blueprint",      "cyan on navy"],
  ["daylight",  "Daylight",       "light · outdoors"],
];
function applyTheme(name){
  document.documentElement.setAttribute("data-theme", name);
  store.set("pipui.theme", name);
}
/* ?theme=phosphor pins a theme without touching stored state -- handy for a
   kiosk that should always boot the same way, and for screenshots. */
const themeParam = new URLSearchParams(location.search).get("theme");
if (themeParam && THEMES.some(([id]) => id === themeParam)){
  document.documentElement.setAttribute("data-theme", themeParam);
} else {
  applyTheme(store.get("pipui.theme", "instrument"));
}

/* ===========================================================================
   10. ROUTER
   =========================================================================== */
const TITLES = {
  home:"PIP-UI", nfc:"NFC / RFID", library:"NFC Library", ir:"Infrared",
  bluetooth:"Bluetooth", proxmark:"Proxmark3", diag:"Diagnostics",
  pins:"GPIO Pins", mmwave:"mmWave Radar", wifiscan:"Network Scanner",
  settings:"Settings", themes:"Themes",
};

/* Builtin tile id -> the Tkinter feature-flag name that gates it. Only flags
   with a real 1:1 web tile are wired up; "Scan" and "WiFi" don't map onto any
   single builtin tile here (NFC scanning has no separate tile, and WiFi's
   launch tools -- Kismet, Wifite -- aren't flag-gated software either). */
const FEATURE_GATES = { bluetooth:"Bluetooth", proxmark:"Proxmark", ir:"IR" };
function go(view, push = true){
  if (!TITLES[view]) view = "home";
  // Leaving IR must stop its sweep/capture pollers, or they keep firing against
  // a view nobody is looking at.
  if (state.view === "ir" && view !== "ir") stopIRTimers();
  if (state.view === "mmwave" && view !== "mmwave") stopRadarTimer();
  if (state.view === "wifiscan" && view !== "wifiscan") stopWsAutoRefresh();
  state.view = view;
  for (const v of Object.keys(TITLES)) $(`#v-${v}`)?.classList.toggle("on", v === view);
  $("#title").textContent = TITLES[view] || "PIP-UI";
  $("#back").hidden = view === "home";
  $("main").scrollTop = 0;
  // Hash routing so a view survives a reload -- a kiosk that reboots into the
  // diagnostics screen should come back to it.
  const target = view === "ir" ? `ir/${irState.tab}` : view;
  if (push && location.hash.slice(1) !== target){
    location.hash = view === "home" ? "" : target;
  }
  RENDER[view]?.();
}

/* "#ir/saved" selects a view and its sub-tab. */
function routeFromHash(){
  const [view, sub] = location.hash.slice(1).split("/");
  if (view === "ir" && sub && IR_TABS.some(([id]) => id === sub)) irState.tab = sub;
  return view || "home";
}
addEventListener("hashchange", () => go(routeFromHash(), false));
$("#back").onclick = () => go("home");
$("#themeBtn").onclick = () => go(state.view === "themes" ? "home" : "themes");
$("#helpBtn").onclick = showLegend;

/* ---- fullscreen / kiosk -------------------------------------------------
   Chromium --kiosk is the real answer on the Pi (see scripts/kiosk.sh); this
   button covers every other way the page gets opened: a normal browser window
   on the Pi, or a laptop on the same desk. */
function paintFsIcon(){
  $("#fsBtn").querySelector("use")
    .setAttribute("href", document.fullscreenElement ? "#i-collapse" : "#i-expand");
}
$("#fsBtn").onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({ navigationUI: "hide" });
  } catch (e){
    toast("Fullscreen refused: " + e.message);
  }
};
document.addEventListener("fullscreenchange", paintFsIcon);

// ?kiosk=1 hides the pointer without needing unclutter installed.
if (new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");

// A long press would otherwise raise the browser context menu on top of a
// kiosk that has no chrome to dismiss it with.
addEventListener("contextmenu", e => e.preventDefault());

/* ===========================================================================
   11. VIEWS
   =========================================================================== */
const RENDER = {};

/* ---- home: the tool launcher ------------------------------------------- */
const CAT_ICON = {
  "Hardware Tools":"chip", "Software Defined Radio":"sine",
  "Wi-Fi":"wifi", "System":"terminal",
};

RENDER.home = () => {
  const host = $("#v-home");
  host.innerHTML = "";

  if (state.toolsErr){
    host.appendChild(el(`<div class="banner bad">${ic("alert")}
      <div><b>Tool list unavailable.</b><br>${esc(state.toolsErr)}</div></div>`).firstChild);
  }
  if (state.health?.simulated){
    host.appendChild(el(`<div class="banner">${ic("alert")}
      <div>Simulation mode <b>${esc(state.health.sim_mode)}</b> — hardware readings are synthetic.</div>
      </div>`).firstChild);
  }
  if (!state.tools.length && !state.toolsErr){
    host.appendChild(el(`<div class="empty">No tools configured.<br>
      Add entries to <span class="mono">src/web/tools.yaml</span>.</div>`).firstChild);
    return;
  }

  const features = state.settings?.features || {};
  const visible = state.tools.filter(t => {
    const gate = FEATURE_GATES[t.id];
    return !gate || features[gate] !== false;
  });

  if (store.get("pipui_mode", "simple") === "simple"){
    const simple = visible.filter(t => t.simple);
    host.appendChild(el(`<div class="simple-head"><h2>PIP-UI</h2>
      <button class="exit">More tools</button></div>`).firstChild);
    if (!simple.length){
      host.appendChild(el(`<div class="empty">No tools are marked for Simple Home yet.<br>
        Turn on a tool under Settings → Simple Home.</div>`).firstChild);
    } else {
      const grid = el(`<div class="simple-grid"></div>`).firstChild;
      for (const t of simple) grid.appendChild(tile(t));
      host.appendChild(grid);
    }
    host.querySelector(".exit").onclick = () => { store.set("pipui_mode", "full"); RENDER.home(); };
    return;
  }

  const cats = [];
  const byCat = {};
  for (const t of visible){
    if (!byCat[t.category]){ byCat[t.category] = []; cats.push(t.category); }
    byCat[t.category].push(t);
  }
  for (const cat of cats){
    host.appendChild(el(`<div class="sec">${ic(CAT_ICON[cat] || "chip")}
      <span class="lbl">${esc(cat)}</span><span class="groove"></span></div>`).firstChild);
    const grid = el(`<div class="grid"></div>`).firstChild;
    for (const t of byCat[cat]) grid.appendChild(tile(t));
    host.appendChild(grid);
  }
};

function tile(t){
  const passive = t.kind === "builtin";
  const cls = passive ? "" : !t.available ? "off" : t.running ? "on" : "";
  const showTag = (!t.available && !passive) || t.root;
  const tagWarn = !t.available;
  const tagText = !t.available ? (t.kind === "link" ? "unreachable" : "absent") : "root";
  const node = el(`<button class="mod ${cls}">
    <div class="top">${ic(t.icon)}
      <span class="topr">
        ${showTag ? `<span class="tag${tagWarn ? " warn" : ""}">${tagText}</span>` : ""}
        ${t.desc ? `<span class="info" title="What is this?">${ic("info")}</span>` : ""}
        ${t.kind === "builtin"
          ? (t.hw_status ? `<span class="led" data-s="${esc(t.hw_status)}" title="${esc(t.hw_status)}"></span>` : "")
            + `<span style="color:var(--ink-faint)">${ic("chevron")}</span>`
          : t.kind === "link" ? `<span style="color:var(--ink-faint)">${ic("external")}</span>`
          : `<span class="led" data-s="${t.running ? "WARN" : t.available ? "PASS" : "idle"}"></span>`}
        ${t.kind === "service" && t.running && t.url
          ? `<span class="openlink" title="Open ${esc(t.name)}">${ic("external")}</span>` : ""}
      </span>
    </div>
    <div class="nm">${esc(t.name)}</div>
    ${t.running ? `<div class="up">${esc(fmtUptime(t.uptime))}</div>`
      : `<div class="cmd" title="${esc(t.desc || "")}">${esc(glanceText(t))}</div>`}
  </button>`).firstChild;

  const info = node.querySelector(".info");
  if (info) info.onclick = (ev) => {
    ev.stopPropagation();
    showInfo(t.name, t.desc);
  };

  const openlink = node.querySelector(".openlink");
  if (openlink) openlink.onclick = (ev) => {
    ev.stopPropagation();
    window.open(t.url, "_blank", "noopener");
  };

  node.onclick = () => {
    if (t.kind === "builtin") return go(t.view);
    if (t.kind === "link") {
      if (!t.available) return toast(`${t.name} is unreachable`);
      return window.open(t.url, "_blank", "noopener");
    }
    if (!t.available) return toast(`${t.name} is not installed`);
    return t.running ? stopTool(t) : launchTool(t);
  };
  return node;
}

async function launchTool(t){
  if (t.root){
    const ok = await confirmAction({
      title:`Launch ${t.name} as root?`,
      body:"This tool runs with elevated privileges and can change system state or put interfaces into monitor mode.",
      detail:t.cmd,
      confirmLabel:"Launch as root",
    });
    if (!ok) return;
  }
  try {
    const res = await api(`/api/tools/${encodeURIComponent(t.id)}/launch`, { method:"POST" });
    state.tools = res.tools || state.tools;
    toast(res.message);
    RENDER.home();
  } catch (e){ toast(e.message); }
}

async function stopTool(t){
  const ok = await confirmAction({
    title:`Stop ${t.name}?`,
    body:"The process will be terminated. Any unsaved work inside it is lost.",
    confirmLabel:"Stop",
  });
  if (!ok) return;
  try {
    const res = await api(`/api/tools/${encodeURIComponent(t.id)}/stop`, { method:"POST" });
    state.tools = res.tools || state.tools;
    toast(res.message);
    RENDER.home();
  } catch (e){ toast(e.message); }
}

          <button class="btn pri" id="nfcSaveBtn">${ic("save")} Save to library</button>

        <div class="row"><span class="k">Active</span><span class="v">${esc(r.active)}</span></div>
        <div class="row"><span class="k">Started</span><span class="v">${r.started ? "yes" : "no"}</span></div>

        ${data.recent.length
          ? data.recent.slice(0,6).map(t => `<div class="row">
              <span class="k mono">${esc(t.uid)}</span>
              <span class="v dim">${esc(ago(t.seen_at))}</span></div>`).join("")

    </div>
    <div class="panel">
      <h3>Write NDEF text</h3>
      <div class="btnrow">

      toast(res.message);
    } catch (e){ toast(e.message); }
  };
  $("#nfcCloneUid").oninput = (e) => { nfcState.cloneUid = e.target.value.trim().toUpperCase(); };
  $("#nfcCloneBtn").onclick = async () => {
    const uid = $("#nfcCloneUid").value.trim().toUpperCase();

    try {
      const res = await api("/api/nfc/clone-uid", { method:"POST", body: JSON.stringify({ uid }) });
      toast(res.message);
    } catch (e){ toast(e.message); }
  };

RENDER.library = async () => {
  const host = $("#v-library");
  host.innerHTML = `<div class="empty">Loading library…</div>`;
  let data;
  try { data = await api("/api/library"); }
  catch (e){ host.innerHTML = `<div class="banner bad">${ic("alert")}<div>${esc(e.message)}</div></div>`; return; }

  if (!data.count){
    host.innerHTML = `<div class="empty">The library is empty.<br>
      Saved tags are stored in <span class="mono">data/library.json</span>.</div>`;
    return;
  }
  host.innerHTML = `<div class="panel"><h3>${data.count} saved tag${data.count === 1 ? "" : "s"}</h3>
    ${data.profiles.map(p => `<div class="row">
      <span class="k">${esc(p.friendly_name || "(unnamed)")}
        <span class="dim" style="display:block;font-size:11px">${esc(p.tag_type)}${p.dump?.present ? " · dump saved" : ""}</span></span>
      <span class="v mono">${esc(p.uid)}</span>
      <button class="btn" data-clone="${esc(p.id)}"
              style="min-height:28px;padding:0 9px">${ic("play")} Clone</button>
      <button class="btn danger" data-del="${esc(p.id)}"
              style="min-height:28px;padding:0 9px">${ic("trash")}</button>
    </div>`).join("")}</div>`;

  host.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute("data-del");
      const profile = data.profiles.find(p => p.id === id);
      const ok = await confirmAction({
        title:"Delete this tag?",
        body:"It is removed from the library permanently. This cannot be undone.",
        detail:`${profile?.friendly_name || ""} ${profile?.uid || ""}`.trim(),
        confirmLabel:"Delete",
      });
      if (!ok) return;
      try { await api(`/api/library/${encodeURIComponent(id)}`, { method:"DELETE" });
            toast("Deleted"); RENDER.library(); }
      catch (e){ toast(e.message); }
    };
  });

  // LF and HF entries saved from the Proxmark3 tile (category "LF"/"HF")
  // clone via that same tile's own commands; everything else was saved from
  // the PN532/NFC tile and clones via UID-to-magic-card there instead.
  // There's no "replay a saved dump" write path yet -- this only ever
  // pushes the UID.
  host.querySelectorAll("[data-clone]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-clone");
      const profile = data.profiles.find(p => p.id === id);
      if (!profile) return;
      const uid = profile.uid.replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
      if (profile.category === "LF") {
        pmState.emId = uid;
        go("proxmark");
      } else if (profile.category === "HF") {
        pmState.hfCloneUid = uid;
        go("proxmark");
      } else {
        nfcState.cloneUid = uid;
        go("nfc");
      }
    };
  });
};

async function paintSweep(state){
  const box = $("#sweepBox");
  if (!box) return;
  if (!state){
    try { state = await api("/api/ir/universal/scan"); } catch { state = { running:false }; }
  }
  const selected = irState.button;
  const pct = state.total ? Math.round((state.index / state.total) * 100) : 0;

  box.innerHTML = state.running
    ? `<div class="progress"><i style="transform:scaleX(${pct / 100})"></i></div>
       <div class="row"><span class="k">${esc(state.button)} · ${state.index}/${state.total}</span>
         <span class="v">${esc(state.current_model || "")}</span></div>
       <div class="btnrow"><button class="btn danger" id="sweepCancel">${ic("stop")} Stop sweep</button></div>`
    : `${state.total && (state.cancelled || state.finished_at) ? `<div class="row">
         <span class="k">Last sweep</span><span class="v dim">${esc(state.button)} ·
         ${state.sent} sent${state.failed ? ` · ${state.failed} failed` : ""}${
           state.cancelled ? " · stopped" : ""}</span></div>` : ""}
       <div class="btnrow">
         <button class="btn pri" id="sweepGo" ${selected ? "" : "disabled"}>${ic("play")}
           ${selected ? `Sweep "${esc(selected)}" across all models` : "Pick a button first"}</button>
       </div>
       ${selected ? `<div class="row"><span class="k">Point the emitter at the device.
         It stops when the device reacts.</span></div>` : ""}`;

  const go = $("#sweepGo");
  if (go) go.onclick = async () => {
    try {
      const res = await api("/api/ir/universal/scan", {
        method:"POST",
        body: JSON.stringify({ device: irState.device, button: irState.button }),
      });
      toast(res.message);
      paintSweep(res.state);
      irState.scanTimer = setInterval(async () => {
        try {
          const s = await api("/api/ir/universal/scan");
          paintSweep(s);
          if (!s.running){ clearInterval(irState.scanTimer); irState.scanTimer = null; }
        } catch { clearInterval(irState.scanTimer); irState.scanTimer = null; }
      }, 600);
    } catch (e){ toast(e.message); }
  };
  const cancel = $("#sweepCancel");
  if (cancel) cancel.onclick = async () => {
    try { const r = await api("/api/ir/universal/scan/cancel", { method:"POST" });
          stopIRTimers(); paintSweep(r.state); toast("Sweep stopped"); }
    catch (e){ toast(e.message); }
  };
}

      detail:r.name, confirmLabel:"Delete",
    });
    if (!ok) return;
    try { await api(`/api/ir/remotes/${r.name}`, { method:"DELETE" });
          toast("Deleted"); irState.remote = null; IR_PANES.saved(); }
    catch (e){ toast(e.message); }
  };
  $("#irBody").querySelectorAll("[data-send]").forEach(b => {
    b.onclick = async () => {
      try {
        const res = await api("/api/ir/send", {
          method:"POST",
          body: JSON.stringify({ remote: r.name, index: Number(b.dataset.send) }),
        });
        toast(res.message);
      } catch (e){ toast(e.message); }
    };
  });
}

IR_PANES.learn = async () => {
  let state = { running:false, result:null, error:"" };
  try { state = await api("/api/ir/capture"); } catch {}

};

function paintLearn(state){
  const body = $("#irBody");
  if (!body) return;
  const r = state.result;
  body.innerHTML = `
    <div class="panel">
      <h3>Learn a new remote</h3>
      ${state.running
        ? `<div class="empty" style="padding:18px">Point the remote at the receiver
             and press a button.<br><b>${state.elapsed || 0}s</b> elapsed — gives up at 12s.</div>
           <div class="progress"><i style="transform:scaleX(${Math.min(100, (state.elapsed / 12) * 100) / 100})"></i></div>
           <div class="btnrow"><button class="btn danger" id="capCancel">${ic("stop")} Cancel</button></div>`
        : r
          ? `<div class="readout">
               <div class="rl">Captured${r.simulated ? " (simulated)" : ""}</div>
               <div class="big">${esc(r.protocol || r.signal_type || "raw")}</div>
               <div class="chips">
                 ${r.address ? `<span class="chip">addr ${esc(r.address)}</span>` : ""}
                 ${r.command ? `<span class="chip">cmd ${esc(r.command)}</span>` : ""}
                 ${r.data_len ? `<span class="chip">${r.data_len} edges</span>` : ""}
               </div>
             </div>
             <div class="btnrow">
               <input type="text" id="capName" placeholder="Name, e.g. LivingRoom/TV"
                      style="flex:1;min-width:150px">
               <button class="btn pri" id="capSave">${ic("save")} Save</button>
               <button class="btn" id="capAgain">${ic("refresh")} Again</button>
             </div>`
          : `${state.error ? `<div class="banner bad">${ic("alert")}
               <div>${esc(state.error)}</div></div>` : ""}
             <div class="empty" style="padding:18px">
               Capture reads from the LIRC RX device for up to 12 seconds.</div>
             <div class="btnrow"><button class="btn pri" id="capGo">${ic("play")}
               Start capture</button></div>`}
    </div>`;

  const go = $("#capGo");
  if (go) go.onclick = async () => {
    try {
      await api("/api/ir/capture", { method:"POST" });
      paintLearn({ running:true, elapsed:0 });
      irState.capTimer = setInterval(async () => {
        try {
          const s = await api("/api/ir/capture");
          paintLearn(s);
          if (!s.running){ clearInterval(irState.capTimer); irState.capTimer = null; }
        } catch { clearInterval(irState.capTimer); irState.capTimer = null; }
      }, 700);
    } catch (e){ toast(e.message); }
  };
  const cancel = $("#capCancel");
  if (cancel) cancel.onclick = async () => {
    try { await api("/api/ir/capture/cancel", { method:"POST" }); stopIRTimers(); IR_PANES.learn(); }
    catch (e){ toast(e.message); }
  };
  const again = $("#capAgain");
  if (again) again.onclick = () => { paintLearn({ running:false, result:null }); };
  const save = $("#capSave");
  if (save) save.onclick = async () => {
    const name = $("#capName").value.trim();
    if (!name) return toast("Give the remote a name first");
    try {
      const res = await api("/api/ir/capture/save", {
        method:"POST", body: JSON.stringify({ name }),
      });
      toast(`Saved as ${res.name}`);
      irState.tab = "saved"; irState.remote = null; RENDER.ir();
    } catch (e){ toast(e.message); }
  };
}

/* ---- Settings: feature toggles -------------------------------------------
   The one piece of Tkinter's System > Features tab that is actually real:
   these flags are read from and written to the same data/system_settings.json
   both apps share, so a toggle here is visible in Tkinter too (and vice versa,
   within 5s via the normal poll). Tkinter's "Debug Window" toggle is left out
   -- it controls a Tk-local debug console with no web equivalent. */
const FEATURE_LABELS = [
  ["Scan", "NFC scanning", "No dedicated web tile yet -- NFC / RFID always scans"],
  ["IR", "Infrared", "Hides the Infrared tile on Home when off"],
  ["Bluetooth", "Bluetooth", "Hides the Bluetooth tile on Home when off"],
  ["WiFi", "Wi-Fi", "Kismet / Wifite tiles are not gated by this flag"],
  ["Proxmark", "Proxmark3", "Hides the Proxmark3 tile on Home when off"],
];

RENDER.settings = async () => {

function paintSettings(data){
  const host = $("#v-settings");
  const f = data.features || {};
  host.innerHTML = `
    <div class="banner">${ic("alert")}<div>
      Shared with the Tkinter app's System → Features tab via the same
      <span class="mono">data/system_settings.json</span>. A change here shows up
      there (and vice versa) within a few seconds.</div></div>
    <div class="panel">
      <h3>Simple Home</h3>
      <div class="toggle" role="switch" tabindex="0" id="simpleToggle"
           aria-pressed="${store.get("pipui_mode", "simple") === "simple"}">
        <div><div class="label">Show the simple home screen</div>
          <div style="font-size:11px;color:var(--ink-dim)">On by default for any device
            that hasn't set this before. Just NFC / RFID, Infrared, and Bluetooth as big
            tiles, with a quiet "More tools" link back to everything else. Only on this
            device/browser. Which tools show up is set by
            <span class="mono">simple: true</span> in tools.yaml.</div></div>
        <span class="swbtn" aria-pressed="${store.get("pipui_mode", "simple") === "simple"}"></span>
      </div>
    </div>
    <div class="panel">
      <h3>Modules</h3>
      ${FEATURE_LABELS.map(([key, label, hint]) => `
        <div class="toggle" role="switch" tabindex="0" data-feature="${key}"
             aria-pressed="${f[key] !== false}">
          <div><div class="label">${esc(label)}</div>
            <div style="font-size:11px;color:var(--ink-dim)">${esc(hint)}</div></div>
          <span class="swbtn" aria-pressed="${f[key] !== false}"></span>
        </div>`).join("")}
    </div>
    <div class="panel">
      <div class="toggle" role="switch" tabindex="0" id="logToggle" style="border-bottom:0"
           aria-pressed="${!!data.log_enabled}">
        <div><div class="label">Log to files</div>
          <div style="font-size:11px;color:var(--ink-dim)">data/logs/*.log, 1 MiB rotation</div></div>
        <span class="swbtn" aria-pressed="${!!data.log_enabled}"></span>
      </div>
    </div>`;

  // The whole row is the hit target; the swbtn inside is purely visual
  // (pointer-events:none in CSS) and just mirrors the row's aria-pressed.
  const pending = { features: { ...f }, log_enabled: !!data.log_enabled };
  const flipRow = (row) => {
    const next = row.getAttribute("aria-pressed") !== "true";
    row.setAttribute("aria-pressed", String(next));
    row.querySelector(".swbtn").setAttribute("aria-pressed", String(next));
    return next;
  };
  host.querySelectorAll(".toggle[data-feature]").forEach(row => {
    const activate = async () => {
      pending.features[row.dataset.feature] = flipRow(row);
      await saveSettings(pending);
    };
    row.onclick = activate;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); activate(); } };
  });
  const logRow = $("#logToggle");
  const activateLog = async () => {
    pending.log_enabled = flipRow(logRow);
    await saveSettings(pending);
  };
  logRow.onclick = activateLog;
  logRow.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); activateLog(); } };

  // Simple Home is a per-device preference (localStorage), not part of the
  // shared system_settings.json -- your device and hers can differ.
  const simpleRow = $("#simpleToggle");
  const activateSimple = () => {
    const on = flipRow(simpleRow);
    store.set("pipui_mode", on ? "simple" : "full");
    toast(on ? "Simple Home on" : "Simple Home off");
  };
  simpleRow.onclick = activateSimple;
  simpleRow.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); activateSimple(); } };
}

async function saveSettings(pending){
  try {
    const res = await api("/api/settings", { method:"PUT", body: JSON.stringify(pending) });
    state.settings = res;
    toast("Saved");
    if (res.error) toast(res.error);
  } catch (e){
    toast(e.message);
  }
}

/* ---- mmWave radar (LD2450) -----------------------------------------------
   Forward-facing fan, not a full circle -- the sensor's FOV is +/-60deg and it
   reports every target on every frame, so unlike the IR "sweep" or the WiFi
   radars this project looked at, there is no rotating beam to animate: a fake
   sweep line would just be decoration on top of a sensor that already sees
   the whole fan at once. */
const RADAR_RANGE_MM = 4000;   // scope's forward extent; matches the LD2450's practical indoor range
const RADAR_HALF_DEG = 60;
let radarTimer = null;
function stopRadarTimer(){ clearInterval(radarTimer); radarTimer = null; }

function radarPoint(x_mm, y_mm){
  // viewBox 0 0 440 330, vertex at (220,322), forward = -Y in SVG space.
  const scale = 300 / RADAR_RANGE_MM;
  return { x: 220 + x_mm * scale, y: 322 - y_mm * scale };
}

function radarScopeSvg(){
  const rings = [1000, 2000, 3000, 4000].map(r => {
    const rad = r / RADAR_RANGE_MM * 300;
    const a = RADAR_HALF_DEG * Math.PI / 180;
    const x0 = 220 - rad * Math.sin(a), y0 = 322 - rad * Math.cos(a);
    const x1 = 220 + rad * Math.sin(a), y1 = 322 - rad * Math.cos(a);
    const lbl = radarPoint(0, r);
    return `<path class="grid-line" d="M${x0.toFixed(1)} ${y0.toFixed(1)}
      A${rad.toFixed(1)} ${rad.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"/>
      <text class="range-lbl" x="${(lbl.x + 4).toFixed(1)}" y="${(lbl.y - 3).toFixed(1)}">${r/1000}m</text>`;
  }).join("");
  const edgeA = radarPoint(-RADAR_RANGE_MM * Math.sin(RADAR_HALF_DEG * Math.PI / 180),
                            RADAR_RANGE_MM * Math.cos(RADAR_HALF_DEG * Math.PI / 180));
  const edgeB = radarPoint(RADAR_RANGE_MM * Math.sin(RADAR_HALF_DEG * Math.PI / 180),
                            RADAR_RANGE_MM * Math.cos(RADAR_HALF_DEG * Math.PI / 180));
  return `<svg class="scope" viewBox="0 0 440 330" id="radarSvg">
    ${rings}
    <line class="edge-line" x1="220" y1="322" x2="${edgeA.x.toFixed(1)}" y2="${edgeA.y.toFixed(1)}"/>
    <line class="edge-line" x1="220" y1="322" x2="${edgeB.x.toFixed(1)}" y2="${edgeB.y.toFixed(1)}"/>
    <g id="radarBlips"></g>
  </svg>`;
}

function paintRadarBlips(targets){
  const g = $("#radarBlips");
  if (!g) return;
  g.innerHTML = targets.map(t => {
    const p = radarPoint(t.x_mm, t.y_mm);
    return `<circle class="blip-ring" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9"/>
      <circle class="blip" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5"/>
      <text class="blip-lbl" x="${(p.x + 7).toFixed(1)}" y="${(p.y - 7).toFixed(1)}">
        ${(t.distance_mm/1000).toFixed(1)}m</text>`;
  }).join("");
}

RENDER.mmwave = async () => {
  const host = $("#v-mmwave");
  host.innerHTML = `<div class="empty">Reading radar status…</div>`;
  let d;
  try { d = await api("/api/mmwave/targets"); }
  catch (e){ host.innerHTML = `<div class="banner bad">${ic("alert")}<div>${esc(e.message)}</div></div>`; return; }

  const r = d.reader;
  host.innerHTML = `
    ${r.degraded ? `<div class="banner bad">${ic("alert")}<div>
      <b>LD2450 unavailable — running the mock reader.</b><br>${esc(r.reason)}</div></div>` : ""}
    ${r.active === "mock" && !r.degraded ? `<div class="banner">${ic("alert")}
      <div>Mock reader active — two synthetic targets, no sensor required.</div></div>` : ""}
    ${!r.polling && r.started ? `<div class="banner">${ic("alert")}
      <div>Reader started but its read thread is no longer running.</div></div>` : ""}
    <div class="two">
      <div class="panel">
        <h3>Scope</h3>
        ${radarScopeSvg()}
      </div>
      <div class="panel">
        <h3>Reader</h3>
        <div class="row"><span class="k">Requested</span><span class="v">${esc(r.requested)}</span></div>
        <div class="row"><span class="k">Active</span><span class="v">${esc(r.active)}</span></div>
        <div class="row"><span class="k">Started</span><span class="v">${r.started ? "yes" : "no"}</span></div>
        <div class="row"><span class="k">Reading</span><span class="v">${r.polling ? "yes" : "no"}</span></div>
        <h3 style="margin-top:12px" id="targetHdr">Targets (0)</h3>
        <div id="targetList"><div class="empty" style="padding:12px">Nothing in range.</div></div>
      </div>
    </div>`;

  const paint = (data) => {
    paintRadarBlips(data.targets);
    $("#targetHdr").textContent = `Targets (${data.targets.length})`;
    $("#targetList").innerHTML = data.targets.length
      ? data.targets.map(t => `<div class="row">
          <span class="k mono">#${t.slot}</span>
          <span class="v">${(t.distance_mm/1000).toFixed(2)}m, ${t.speed_mm_s} mm/s</span></div>`).join("")
      : `<div class="empty" style="padding:12px">Nothing in range.</div>`;
  };
  paint(d);

  stopRadarTimer();
  radarTimer = setInterval(async () => {
    try { paint(await api("/api/mmwave/targets")); }
    catch { stopRadarTimer(); }
  }, 150);
};

/* ---- Wi-Fi network scanner / LAN devices ---------------------------------
   Two tabs sharing one view: AP scan (managed-mode `iw`) and LAN devices
   (`arp-scan` -- a different, non-Wi-Fi-specific capability: who's on this
   subnet, full stop). Both block server-side for the duration of their scan
   and the POST response *is* the result, so there's no poll loop the way
   mmWave/IR need -- just a button and a loading state. Auto-refresh is the
   one exception: a client-side timer re-running the same POST.

   Per-AP client capture (the monitor-mode piece) is nested under each
   network row rather than a third tab, since it's scoped to one AP, not a
   standing view of its own. */
const WS_TABS = [["ap","Wi-Fi"], ["lan","LAN Devices"]];
const WS_CAPTURE_SECONDS = 8; // matches wifiscan.py's CLIENT_CAPTURE_SECONDS
const WS_AUTO_INTERVAL_MS = 30000;
const WS_FLAG_LABEL = { open:"open", "weak-encryption":"WEP", "duplicate-ssid":"dup SSID" };
const wsState = { tab:"ap", autoRefresh:false, autoTimer:null, openClients:null };

function stopWsAutoRefresh(){
  clearInterval(wsState.autoTimer);
  wsState.autoTimer = null;
}
function signalTier(dbm){
  if (dbm >= -60) return "PASS";
  if (dbm >= -75) return "WARN";
  return "FAIL";
}
function safeId(bssid){ return bssid.replace(/[^a-z0-9]/gi, ""); }
function sparkline(history){
  if (!history || history.length < 2) return "";
  const lo = -90, hi = -30; // clamp range: -30 excellent, -90 unusable
  const bars = history.map(v => {
    const pct = Math.max(4, Math.min(100, ((v - lo) / (hi - lo)) * 100));
    return `<i style="height:${pct}%"></i>`;
  }).join("");
  return `<span class="mini-spark" title="last ${history.length} reading(s), oldest to newest">${bars}</span>`;
}

RENDER.wifiscan = () => {
  const host = $("#v-wifiscan");
  host.innerHTML = `
    <div class="tabs" id="wsTabs">
      ${WS_TABS.map(([id,label]) =>
        `<button data-t="${id}" aria-selected="${wsState.tab === id}">${label}</button>`).join("")}
    </div>
    <div id="wsBody"><div class="empty">Loading…</div></div>`;
  host.querySelectorAll("#wsTabs button").forEach(b => {
    b.onclick = () => {
      stopWsAutoRefresh();
      wsState.tab = b.dataset.t;
      wsState.openClients = null;
      RENDER.wifiscan();
    };
  });
  WS_PANES[wsState.tab]();
};

const WS_PANES = {};

/* ---- Wi-Fi tab ---- */
WS_PANES.ap = async () => {
  const body = $("#wsBody");
  body.innerHTML = `<div class="empty">Loading last scan…</div>`;
  let snap;
  try { snap = await api("/api/wifiscan/networks"); }
  catch (e){ body.innerHTML = `<div class="banner bad">${ic("alert")}<div>${esc(e.message)}</div></div>`; return; }

  body.innerHTML = `
    ${snap.error ? `<div class="banner bad">${ic("alert")}<div>
      <b>Last scan failed.</b><br>${esc(snap.error)}</div></div>` : ""}
    <div class="panel">
      <div class="row" style="border-bottom:0">
        <span class="k">Interface</span><span class="v mono">${esc(snap.iface)}</span>
      </div>
      <div class="btnrow">
        <button class="btn pri" id="wsScanBtn">${ic("refresh")} Scan now</button>
        <label class="row" style="border-bottom:0;width:auto;gap:7px;padding:0 0 0 4px">
          <input type="checkbox" id="wsAuto" ${wsState.autoRefresh ? "checked" : ""}>
          <span class="k">Auto-refresh (30s)</span>
        </label>
      </div>
    </div>
    <div class="panel">
      <h3 id="wsHdr">Networks (${snap.networks.length})</h3>
      <div id="wsList"></div>
    </div>`;
  paintApList(snap);

  $("#wsScanBtn").onclick = () => runApScan($("#wsScanBtn"));
  $("#wsAuto").onchange = (e) => {
    wsState.autoRefresh = e.target.checked;
    stopWsAutoRefresh();
    if (wsState.autoRefresh) wsState.autoTimer = setInterval(() => runApScan(null), WS_AUTO_INTERVAL_MS);
  };
  if (wsState.autoRefresh) wsState.autoTimer = setInterval(() => runApScan(null), WS_AUTO_INTERVAL_MS);
};

async function runApScan(btn){
  if (btn){ btn.disabled = true; btn.innerHTML = `${ic("refresh")} Scanning…`; }
  try {
    const result = await api("/api/wifiscan/scan", { method: "POST" });
    paintApList(result);
    if (btn) toast(result.error || `Found ${result.networks.length} network(s)`);
  } catch (e){
    if (btn) toast(e.message);
  } finally {
    if (btn){ btn.disabled = false; btn.innerHTML = `${ic("refresh")} Scan now`; }
  }
}

function paintApList(snap){
  const list = $("#wsList");
  const hdr = $("#wsHdr");
  if (!list) return;
  hdr.textContent = `Networks (${snap.networks.length})`;
  list.innerHTML = snap.networks.length
    ? snap.networks.map(n => {
        const open = wsState.openClients === n.bssid;
        return `
        <div class="wsNet">
          <div class="row" style="border-bottom:0">
            <span class="led" data-s="${signalTier(n.signal_dbm)}" title="${n.signal_dbm} dBm"></span>
            <span class="k">${esc(n.ssid)}</span>
            <span class="chip">${esc(n.security)}</span>
            ${(n.flags || []).map(f => `<span class="tag warn">${esc(WS_FLAG_LABEL[f] || f)}</span>`).join("")}
            <span class="v dim mono">${n.signal_dbm} dBm</span>
          </div>
          <div class="row" style="padding-top:0">
            <span class="v dim mono">${n.band} · ch ${n.channel ?? "?"}</span>
            ${sparkline(n.history)}
            <button class="btn" style="min-height:26px;padding:0 10px;font-size:10px;margin-left:auto"
              data-clients="${esc(n.bssid)}" data-channel="${n.channel ?? ""}">${open ? "Hide" : "Clients"}</button>
          </div>
          <div class="wsClients" id="wc-${safeId(n.bssid)}" ${open ? "" : "hidden"}></div>
        </div>`;
      }).join("")
    : `<div class="empty" style="padding:12px">${snap.updated_at ? "Scan ran, nothing found." : "Not scanned yet."}</div>`;

  list.querySelectorAll("[data-clients]").forEach(btn => {
    btn.onclick = () => toggleClients(btn, btn.dataset.clients, btn.dataset.channel ? Number(btn.dataset.channel) : null);
  });
}

async function toggleClients(btn, bssid, channel){
  const box = $(`#wc-${safeId(bssid)}`);
  if (!box) return;
  if (wsState.openClients === bssid){
    wsState.openClients = null;
    box.hidden = true;
    btn.textContent = "Clients";
    return;
  }
  wsState.openClients = bssid;
  box.hidden = false;
  btn.textContent = "Hide";
  box.innerHTML = `<div class="empty" style="padding:8px">Loading…</div>`;

  let status;
  try { status = await api(`/api/wifiscan/clients/${encodeURIComponent(bssid)}`); }
  catch (e){ box.innerHTML = `<div class="empty" style="padding:8px">${esc(e.message)}</div>`; return; }
  paintClientBox(box, bssid, channel, status);
}

function paintClientBox(box, bssid, channel, status){
  if (status.error){
    box.innerHTML = `<div class="warn mono" style="padding:8px 0;white-space:pre-wrap">${esc(status.error)}</div>`;
    return;
  }
  const btnId = `wcCap-${safeId(bssid)}`;
  box.innerHTML = `
    <div class="btnrow" style="margin:4px 0">
      <button class="btn" id="${btnId}">${ic("refresh")} Capture (${WS_CAPTURE_SECONDS}s)</button>
    </div>
    ${status.clients.length
      ? status.clients.map(c => `<div class="row">
          <span class="k mono">${esc(c.mac)}</span>
          <span class="v dim mono">${c.power_dbm ?? "?"} dBm</span></div>`).join("")
      : `<div class="empty" style="padding:8px">No capture yet.</div>`}`;

  $(`#${btnId}`).onclick = async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    b.innerHTML = `${ic("refresh")} Capturing (${WS_CAPTURE_SECONDS}s)…`;
    try {
      const qs = channel ? `?channel=${channel}` : "";
      const result = await api(`/api/wifiscan/clients/${encodeURIComponent(bssid)}/capture${qs}`, { method: "POST" });
      paintClientBox(box, bssid, channel, result);
    } catch (e){ toast(e.message); b.disabled = false; b.innerHTML = `${ic("refresh")} Capture (${WS_CAPTURE_SECONDS}s)`; }
  };
}

/* ---- LAN Devices tab ------------------------------------------------------
