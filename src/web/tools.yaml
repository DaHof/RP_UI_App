# PIP-UI tool manifest -- the single source of truth for the dashboard tiles.
#
# This file is an ALLOWLIST. The API only ever accepts a tool `id`; nothing from
# a request reaches a command line. Adding a tool here is therefore a privilege
# decision, which is why it is config rather than something the UI can do.
#
# Fields
#   id        required, unique. What the API refers to.
#   name      label on the tile.
#   icon      sprite symbol id (see static/index.html).
#   category  groups tiles under a heading, in the order first seen below.
#   kind      "launch" runs argv; "builtin" opens an in-dashboard view;
#             "link" opens `url` in a new tab -- for a tool that lives on
#             another machine (e.g. a WiFi sensing app on a separate Kali box),
#             not a process this dashboard runs or can stop.
#   view      for kind: builtin -- which screen to open.
#   argv      for kind: launch -- MUST be a list, never a string. Passed
#             verbatim, no shell.
#   url       for kind: link -- MUST be a reachable http(s) URL on your LAN.
#             Never a command, never user-suppliable; it's a hyperlink.
#   short     the always-visible one-liner on the tile itself. Write this one
#             tight -- a few words, not a sentence. This is the "at a glance"
#             text; it is not truncated from `desc`, it's its own thing.
#   desc      the longer explanation, shown only when the info (i) icon is
#             tapped. This is where the detail goes -- what it actually does,
#             caveats, where its own UI lives, etc.
#   note      small print shown on the tile. Distinct from `short`: a note is
#             usually a caveat or a pointer (a port number, "edit this"), not
#             a description of what the tool does.
#   root      true marks it as privileged; the UI demands a confirm step.
#
# To add your own tool, copy a block and change `id`, `name` and `argv`.
# A tool whose binary is missing shows as "absent" rather than disappearing,
# so a typo is visible instead of silent. A `link` tile has no such check --
# there is no way to probe a sensing app on someone else's box, so it always
# shows available and simply fails to load if that host is off or unreachable.
#
# Note on `sudo` entries: stdin is closed when launching, so a password prompt
# fails immediately rather than hanging. Passwordless sudo must be configured
# for these to work.

tools:
  # ---------------------------------------------------------------- built in
  - id: nfc
    name: NFC / RFID
    icon: card
    category: Hardware Tools
    kind: builtin
    view: nfc
    simple: true
    short: Read, save & clone tags
    desc: >-
      Reads 13.56MHz tags with the PN532 reader. Scan a card to see its
      UID/type, save it to your library, and clone or emulate it later.

  - id: proxmark
    name: Proxmark3
    icon: chip
    category: Hardware Tools
    kind: builtin
    view: proxmark
    simple: true
    short: RFID/NFC research tool
    desc: >-
      RFID tool covering both low-frequency (125kHz, e.g. key fobs) and
      high-frequency (13.56MHz) cards via a Proxmark3 device over USB.
      Device info and LF/HF search are wired up to the real `proxmark3`
      client; clone, write, and sniff are not implemented yet.

  - id: ir
    name: Infrared
    icon: ir
    category: Hardware Tools
    kind: builtin
    view: ir
    simple: true
    short: Capture & replay remotes
    desc: >-
      Captures and replays IR remote signals (TVs, ACs, etc.) over the
      GPIO-wired transmitter/receiver. Includes a saved-remotes library and
      a universal-remote scan mode.

  - id: bluetooth
    name: Bluetooth
    icon: bt
    category: Hardware Tools
    kind: builtin
    view: bluetooth
    simple: true
    short: Scan, pair & connect
    desc: >-
      Scans for nearby Bluetooth devices and lets you pair, trust, and
      connect to them via BlueZ.

  - id: diag
    name: Diagnostics
    icon: gauge
    category: Hardware Tools
    kind: builtin
    view: diag
    short: Hardware health checks
    desc: >-
      Runs health probes across the hardware (I2C bus, IR, USB devices,
      power/throttling) and reports PASS/WARN/FAIL for each.

  - id: pins
    name: GPIO Pins
    icon: plug
    category: Hardware Tools
    kind: builtin
    view: pins
    short: GPIO wiring reference
    desc: >-
      Shows which GPIO pin each piece of hardware is wired to, so you can
      check or change wiring without digging through the README.

  - id: mmwave
    name: mmWave Radar
    icon: radar
    category: Hardware Tools
    note: HLK-LD2450 on UART (pins 8/10)
    kind: builtin
    view: mmwave
    short: Live radar target tracking
    desc: >-
      Live presence/position tracking from an HLK-LD2450 radar sensor on
      UART -- shows each detected target's distance, position, and speed.

  - id: settings
    name: Settings
    icon: sliders
    category: Hardware Tools
    kind: builtin
    view: settings
    short: Feature toggles & config
    desc: >-
      Toggle features on/off, set GPIO pin assignments, and control
      logging.

  # ------------------------------------------------------ software defined radio
  - id: gnuradio
    name: GNU Radio
    icon: sine
    category: Software Defined Radio
    argv: ["gnuradio-companion"]
    short: Visual SDR flowgraph builder
    desc: >-
      Visual, drag-and-drop toolkit for building SDR signal-processing
      pipelines from scratch. Flexible but the steepest learning curve of
      the SDR tools here.

  - id: gqrx
    name: GQRX
    icon: signal
    category: Software Defined Radio
    argv: ["gqrx"]
    short: SDR receiver & spectrum view
    desc: >-
      Simple SDR receiver and spectrum analyzer -- tune to a frequency and
      listen or watch the waterfall. Good starting point for "what's on
      the air".

  - id: urh
    name: URH
    icon: refresh
    category: Software Defined Radio
    note: Universal Radio Hacker
    argv: ["urh"]
    short: Reverse-engineer RF protocols
    desc: >-
      Reverse-engineers unknown wireless protocols: capture a signal,
      decode it into bits, then replay or fuzz it. Popular for garage
      doors, key fobs, and similar devices.

  - id: sdrangel
    name: SDRangel
    icon: antenna
    category: Software Defined Radio
    argv: ["sdrangel"]
    short: Full SDR receive/transmit suite
    desc: >-
      Full-featured SDR receiver/transmitter suite with lots of built-in
      demodulators, in the same space as GQRX and GNU Radio.

  - id: rtl433
    name: rtl_433
    icon: thermo
    category: Software Defined Radio
    note: decodes 433 MHz sensors
    argv: ["rtl_433"]
    short: Decodes 433 MHz sensors
    desc: >-
      Decodes data from cheap 433MHz devices -- weather stations,
      tire-pressure sensors, remote switches -- straight to readable
      output, no manual setup needed.

  # --------------------------------------------------------------------- wi-fi
  - id: wifiscan
    name: Network Scanner
    icon: wifi
    category: Wi-Fi
    kind: builtin
    view: wifiscan
    short: WiFi, LAN devices & signal
    desc: >-
      Two tabs: nearby Wi-Fi access points (SSID, signal, channel, security,
      with open/WEP/duplicate-SSID flags and a signal-history sparkline) via
      a normal managed-mode scan -- not Kismet's monitor-mode capture -- and
      LAN devices (IP/MAC/vendor/hostname) via an ARP sweep of your subnet,
      which isn't Wi-Fi specific at all. Each AP also has a "Clients" action
      for a bounded capture of who's connected to it, but that one needs a
      second, dedicated monitor-mode adapter (WIFI_MONITOR_IFACE) and stays
      off until you configure one -- it deliberately never touches the
      interface this scan itself uses, since that would disconnect it.
      Needs `iw`/`arp-scan` to have their capabilities set
      (scripts/install-tools.sh does this) or scans fail with "Operation not
      permitted".

  - id: kismet
    name: Kismet
    icon: alert
    category: Wi-Fi
    note: "web UI on :2501"
    root: true
    argv: ["sudo", "kismet"]
    short: Wireless scanner & IDS
    desc: >-
      Passive Wi-Fi/Bluetooth/SDR network detector and packet sniffer --
      lists nearby networks and devices in a web UI on port 2501.

  - id: wifite
    name: Wifite
    icon: play
    category: Wi-Fi
    root: true
    argv: ["x-terminal-emulator", "-e", "sudo", "wifite"]
    short: Automated Wi-Fi auditing
    desc: >-
      Automates common Wi-Fi auditing attacks (handshake capture, WPS,
      etc.) against networks you're authorized to test.

  # erogluyusuf/WiFi-Sensing-Radar ("Solar Radar") -- RSSI presence sensing.
  # Installed locally on this Pi (/home/kali/WiFi-Sensing-Radar) as three
  # systemd services (sentinel-backend, sentinel-frontend, sentinel-sniffer),
  # dedicating wlan1 (the AWUS036ACM) to monitor mode against the MoDeans AP.
  - id: wifi-sensing-radar
    name: Solar Radar
    icon: external
    category: Wi-Fi
    kind: link
    note: "Sentinel services on this Pi -- edit targets in ~/WiFi-Sensing-Radar/.env"
    url: "http://127.0.0.1:8088"
    short: WiFi presence sensing (local)
    desc: >-
      Opens the web UI of "WiFi-Sensing-Radar" (Sentinel), running locally
      on this Pi via systemd. It dedicates wlan1 (the Alfa AWUS036ACM) to
      monitor mode and streams RSSI jitter from a target BSSID into a
      real-time radar view. This tile just links out -- manage the services
      with systemctl (sentinel-backend/-frontend/-sniffer).

  # -------------------------------------------------------------------- system
  - id: terminal
    name: Terminal
    icon: terminal
    category: System
    argv: ["x-terminal-emulator"]
    short: Opens a system shell
    desc: "Opens a regular terminal window."

  - id: btop
    name: System Monitor
    icon: activity
    category: System
    argv: ["x-terminal-emulator", "-e", "btop"]
    short: CPU/RAM/process monitor
    desc: >-
      Opens btop, a terminal-based resource monitor for CPU, RAM, disk, and
      network usage.

  - id: claude-code
    name: Claude Code
    icon: power
    category: System
    note: "scripts/install-tools.sh installs this"
    argv: ["x-terminal-emulator", "-e", "claude"]
    short: AI coding agent
    desc: >-
      Opens a terminal running the Claude Code CLI, for working on this
      project's own code from the kiosk.
